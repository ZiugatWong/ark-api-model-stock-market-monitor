<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ark 模型股市行情</title>
    <link
      rel="icon"
      type="image/webp"
      href="https://image.dooo.ng/t/2026/09/23/6ab3a1338cd4f.webp"
    />
    <link rel="stylesheet" href="./style.css" />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.0.1/dist/lightweight-charts.standalone.production.js"
    ></script>
    <script defer src="./app.js"></script>
  </head>
  <body>
    <!-- 内联防闪烁：CSS 加载前先定主题（默认暗色，localStorage 优先，回退系统偏好） -->
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("ark_dashboard_theme");
        } catch (e) {}
        var light =
          stored === "light" ||
          (stored === null &&
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.className = light
          ? "theme-light"
          : "theme-dark";
      })();
    </script>

    <header id="topbar">
      <div class="topbar-brand">
        <h1 class="topbar-title">Ark 模型股市行情</h1>
        <span
          id="last-updated"
          class="last-updated"
          title="数据更新时间"
        ></span>
      </div>
      <div class="topbar-actions">
        <button
          id="btn-refresh"
          class="btn btn-icon-text"
          type="button"
          aria-label="刷新数据"
          title="刷新数据"
        >
          <span class="btn-refresh-spin">刷</span>
        </button>
        <!-- 更多按钮：向下弹出菜单（设置 / 说明 / 更新日志） -->
        <div id="more-wrap">
          <button
            id="btn-more"
            class="btn btn-icon"
            type="button"
            aria-label="更多"
            title="更多"
            aria-haspopup="true"
          >
            ⋯
          </button>
          <div id="more-menu" hidden>
            <button id="menu-settings" class="more-menu-item" type="button">
              设置
            </button>
            <button id="menu-manual" class="more-menu-item" type="button">
              使用说明
            </button>
            <button id="menu-changelog" class="more-menu-item" type="button">
              更新日志
            </button>
          </div>
        </div>
      </div>
    </header>

    <div id="error-banner-wrap">
      <div id="error-banner" hidden>
        <span id="error-text"></span>
        <button id="btn-retry" class="btn btn-sm" type="button">重试</button>
      </div>
    </div>

    <main id="grid" aria-live="polite"></main>

    <!-- 详情视图：全屏遮罩 + 大图 -->
    <div id="detail-overlay" hidden>
      <div id="detail-backdrop"></div>
      <section
        id="detail-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="detail-name"
      >
        <div id="detail-header">
          <div class="detail-title-box">
            <h2 id="detail-name"></h2>
            <span id="detail-stale" class="badge badge-stale" hidden>停滞</span>
          </div>
          <div class="detail-price-box">
            <span id="detail-price" class="detail-price"></span>
            <span id="detail-change" class="detail-change"></span>
          </div>
          <button
            id="btn-detail-close"
            class="btn btn-sm"
            type="button"
            aria-label="关闭"
          >
            ✕
          </button>
          <!-- range 标签放头部 flex 内：竖屏换行独占一行（模型名下方），横屏并入模型名右侧（见 CSS order 控制） -->
          <div id="range-tabs" role="tablist"></div>
        </div>
        <div id="chart-container"></div>
        <div id="detail-stats"></div>
      </section>
    </div>

    <!-- 说明弹窗：内容来自 GET /api/manual（服务端读取 manual.md 转 HTML） -->
    <div id="manual-overlay" hidden>
      <div id="manual-backdrop"></div>
      <section
        id="manual-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="manual-title"
      >
        <div id="manual-header">
          <h2 id="manual-title">说明</h2>
          <button
            id="btn-manual-close"
            class="btn btn-sm"
            type="button"
            aria-label="关闭"
          >
            ✕
          </button>
        </div>
        <div id="manual-body" class="manual-body"></div>
      </section>
    </div>

    <!-- 更新日志弹窗：内容来自 GET /api/changelog（服务端读取 changelog.md 转 HTML） -->
    <div id="changelog-overlay" hidden>
      <div id="changelog-backdrop"></div>
      <section
        id="changelog-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="changelog-title"
      >
        <div id="changelog-header">
          <h2 id="changelog-title">更新日志</h2>
          <button
            id="btn-changelog-close"
            class="btn btn-sm"
            type="button"
            aria-label="关闭"
          >
            ✕
          </button>
        </div>
        <div id="changelog-body" class="manual-body"></div>
      </section>
    </div>

    <!-- 设置弹窗：急涨/急跌阈值滑杆，值持久化到 localStorage -->
    <div id="settings-overlay" hidden>
      <div id="settings-backdrop"></div>
      <section
        id="settings-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="settings-title"
      >
        <div id="settings-header">
          <h2 id="settings-title">设置</h2>
          <button
            id="btn-settings-close"
            class="btn btn-sm"
            type="button"
            aria-label="关闭"
          >
            ✕
          </button>
        </div>
        <div class="settings-body">
          <div class="setting-item">
            <div class="setting-label-row">
              <label>主题</label>
            </div>
            <div id="theme-segment" role="group" aria-label="主题切换">
              <button type="button" class="theme-option" data-theme="light">
                ☀ 亮色
              </button>
              <button type="button" class="theme-option" data-theme="dark">
                ☾ 暗色
              </button>
            </div>
          </div>
          <div class="setting-item">
            <div class="setting-label-row">
              <label for="setting-surge">急涨阈值</label>
              <span id="setting-surge-value" class="setting-value">5%</span>
            </div>
            <input type="range" id="setting-surge" min="1" max="20" step="1" />
            <p class="setting-desc">
              最近一次涨幅超过该百分比时展示「急涨」标签
            </p>
          </div>
          <div class="setting-item">
            <div class="setting-label-row">
              <label for="setting-drop">急跌阈值</label>
              <span id="setting-drop-value" class="setting-value">5%</span>
            </div>
            <input type="range" id="setting-drop" min="1" max="20" step="1" />
            <p class="setting-desc">
              最近一次跌幅超过该百分比时展示「急跌」标签
            </p>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
