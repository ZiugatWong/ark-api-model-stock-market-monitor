services:
  ark-api-model-stock-service:
    build: .
    image: ark-api-model-stock-service:latest
    container_name: ark-api-model-stock-service
    ports:
      - "3210:3210"
    volumes:
      # 挂载说明文档：改动即时生效，无需重建镜像或重启容器
      - ./manual.md:/app/manual.md:ro
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://ark-api-model-stock-redis:6379
      - ARK_GAME_COOKIE=${ARK_GAME_COOKIE}
      - ARK_GAME_BASE_URL=https://game.arkengine.me
      - SYNC_CRON=1/5 * * * *
      - RATE_LIMIT_WINDOW_SECONDS=60
      - RATE_LIMIT_MAX=2
      - PORT=3210
      - EXPRESS_TRUST_PROXY=false
      - ARK_GAME_API_FAILED_NOTIFICATION=${ARK_GAME_API_FAILED_NOTIFICATION:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    depends_on:
      - ark-api-model-stock-redis
    networks:
      - ark-api-network
    restart: unless-stopped

  ark-api-model-stock-redis:
    image: redis:7-alpine
    container_name: ark-api-model-stock-redis
    volumes:
      - redis-data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - ark-api-network
    restart: unless-stopped

networks:
  ark-api-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
